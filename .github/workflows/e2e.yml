name: E2E Tests

on:

  push:
    branches:
      - "*"

  pull_request:
    branches:
      - "*"

jobs:
  tests:

    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Use Node.js
      uses: actions/setup-node@v6
      with:
        node-version: "24"

    - name: setup
      run: ./test/e2e/setup.sh

    - name: E2E test
      run: npm run e2e
