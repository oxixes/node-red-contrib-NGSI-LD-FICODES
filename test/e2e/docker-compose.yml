services:
  postgres:
    image: timescale/timescaledb-ha:pg17
    ports:
      - '5432'
    environment:
      POSTGRES_USER: ngb
      POSTGRES_PASSWORD: ngb
      POSTGRES_DB: ngb
  scorpio:
    image: scorpiobroker/all-in-one-runner:6.0.1
    environment:
      DBHOST: postgres
    ports:
      - '9090:9090'
    depends_on:
      - postgres
